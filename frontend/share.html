<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share File riêng</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><div class="container header-inner"><button class="icon-btn" id="menuBtn" type="button">☰</button><a class="brand" href="share.html" id="brand">🔐 Share File</a><span class="header-tag" id="countdown"></span></div></header><div class="drawer-backdrop" id="drawerBackdrop"></div><aside class="drawer" id="drawer"><div class="drawer-head"><b>MENU</b><button class="icon-btn" id="drawerClose" type="button">×</button></div><a href="index.html">⌂ Trang chủ</a><a href="rent.html">🔐 Thuê Share File riêng</a></aside><main class="container section"><div id="head"></div><section id="products" class="product-grid"></section><section class="section"><div class="section-head"><h2>Bình luận</h2></div><form id="commentForm" class="comment-form"><input name="name" placeholder="Tên"><textarea name="text" rows="3" placeholder="Viết bình luận..."></textarea><button class="btn primary">Đăng</button></form><div id="commentsList" class="comments-list"></div></section></main><script>const menuBtn=document.querySelector("#menuBtn"),drawer=document.querySelector("#drawer"),drawerBackdrop=document.querySelector("#drawerBackdrop"),drawerClose=document.querySelector("#drawerClose");const closeDrawer=()=>{drawer?.classList.remove("open");drawerBackdrop?.classList.remove("open")};menuBtn?.addEventListener("click",()=>{drawer?.classList.add("open");drawerBackdrop?.classList.add("open")});drawerClose?.addEventListener("click",closeDrawer);drawerBackdrop?.addEventListener("click",closeDrawer);</script><script src="assets/js/config.js"></script><script src="assets/js/tenant-share.js"></script></body></html>
