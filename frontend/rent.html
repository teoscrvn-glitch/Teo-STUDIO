<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thuê Share File — Téo Studio</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">🍎</span><span>Lại Húp <b>File</b></span></a></div></header><main class="container section"><div class="admin-card" style="max-width:650px;margin:30px auto"><span class="eyebrow">RENTAL</span><h1>Thuê Share File riêng</h1><p class="muted">Bạn thanh toán và gửi thông tin qua Zalo cho Téo. Téo sẽ cấp ID + mật khẩu và thời hạn thuê.</p><div class="support-grid"><a class="support-box" id="zalo" href="#"><span>💬</span><div><b>Liên hệ Téo qua Zalo</b><small>Gửi ảnh thanh toán + ID muốn đặt</small></div><strong>→</strong></a></div><hr style="border-color:var(--border);margin:20px 0"><h3>Đã có tài khoản?</h3><form id="login"><label class="muted small">ID tenant<input name="tenant" required placeholder="Teongdungs001"></label><label class="muted small">Mật khẩu<input name="password" type="password" required></label><button class="btn primary" type="submit">Đăng nhập</button><p id="msg" class="muted"></p></form></div></main><script src="assets/js/config.js"></script><script>const cfg=window.TEO_CONFIG||{},api=p=>(cfg.API_BASE_URL||'').replace(/\/$/,'')+p;document.querySelector('#zalo').href=cfg.RENT_ZALO_URL||'#';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),m=document.querySelector('#msg');m.textContent='Đang đăng nhập...';try{const r=await fetch(api('/api/tenant/login'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tenant:f.get('tenant'),password:f.get('password')})}),x=await r.json();if(!r.ok)throw Error(x.error||'Đăng nhập thất bại');sessionStorage.setItem('TEO_TENANT_SESSION',x.token);location.href=x.adminUrl||('/tenant-admin.html?tenant='+encodeURIComponent(x.tenant.slug))}catch(err){m.textContent=err.message}};</script></body></html>
