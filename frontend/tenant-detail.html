<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File — Téo Studio</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="icon-btn" id="back">←</a><a href="#" class="brand">🍎 <b>Share File</b></a></div></header><main class="container" style="padding:55px 0"><div id="detail"></div></main><script src="assets/js/config.js"></script><script>const q=new URLSearchParams(location.search),slug=q.get('tenant'),id=q.get('id'),api=(p)=>(window.TEO_CONFIG.API_BASE_URL||'').replace(/\/$/,'')+p;document.querySelector('#back').href='share.html?tenant='+encodeURIComponent(slug);fetch(api('/api/public-tenant/'+encodeURIComponent(slug)+'/product/'+encodeURIComponent(id))).then(r=>r.json()).then(x=>{if(!x.product)throw Error('File không tồn tại');const p=x.product;document.title=p.title+' — Téo Studio';document.querySelector('#detail').innerHTML=`<div class="detail-card"><div class="detail-thumb"><img src="${String(p.thumb||'assets/img/default-avatar.svg').replace(/"/g,'&quot;')}"></div><div class="detail-body"><div class="product-meta"><span class="type-pill free">FILE</span><span>${p.game||'Khác'}</span></div><h1>${p.title}</h1><p>${p.description||''}</p><div class="rule-box">⚠ <b>Lưu ý:</b> ${p.warning||'Kiểm tra file trước khi sử dụng.'}</div><a class="btn primary full" href="tenant-download.html?tenant=${encodeURIComponent(slug)}&id=${encodeURIComponent(p.id)}">⬇ Xem link tải</a></div></div>`}).catch(e=>document.querySelector('#detail').innerHTML='<div class="rule-box">'+e.message+'</div>');</script></body></html>
