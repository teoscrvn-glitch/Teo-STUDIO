<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenant Admin — Téo Studio</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/admin.css"></head><body class="admin-body"><header class="admin-topbar"><a href="share.html" id="shareLink" class="brand">🔐 Share File</a><span class="admin-title">TENANT ADMIN</span><div class="spacer"></div><span id="tenantBadge" class="header-tag"></span><button class="header-tag" id="logout">Đăng xuất</button></header><main class="admin-main" style="max-width:1200px;margin:auto"><div id="loginBox" class="admin-card" style="max-width:500px;margin:40px auto"><h2>Đăng nhập tenant</h2><form id="login"><label>ID<input name="tenant" required></label><label>Mật khẩu<input name="password" type="password" required></label><button class="btn primary">Đăng nhập</button><p id="msg" class="muted"></p></form></div><div id="app" class="hidden"><div class="admin-page-head"><div><span class="eyebrow">TENANT</span><h1 id="title">Quản lý Share File</h1><span class="muted small">Không có quyền tạo tenant khác. ID không thể đổi.</span></div></div><div class="stat-grid stats-5"><div class="stat"><span>File</span><b id="count">0</b></div><div class="stat"><span>Trạng thái</span><b id="status">-</b></div><div class="stat"><span>Còn</span><b id="days">-</b></div><div class="stat"><span>Hết hạn</span><b id="expiry">-</b></div><div class="stat"><span>Hôm nay</span><b id="today">0</b></div></div><div class="admin-card"><h3>Thêm file</h3><form id="productForm" class="form-grid"><label>Tên file<input name="title" required></label><label>Game/Tag<input name="game"></label><label class="wide">Mô tả<textarea name="description"></textarea></label><label>Thumbnail URL<input name="thumb"></label><label>Link tải<input name="download_link" required></label><label class="wide">Lưu ý<textarea name="warning"></textarea></label><div class="form-actions"><button class="btn primary">Thêm file</button></div></form></div><div class="admin-card table-wrap"><table><thead><tr><th>Tên</th><th>Tag</th><th>View</th><th>Link</th><th></th></tr></thead><tbody id="table"></tbody></table></div><div class="admin-card"><h3>Cài đặt</h3><form id="settings" class="form-grid"><label>Tên web<input name="siteName"></label><label>Tên studio<input name="studio"></label><label>Tiêu đề<input name="heroTitle"></label><label class="wide">Mô tả<textarea name="heroText"></textarea></label><label>Admin hỗ trợ<input name="adminContact"></label><label>Nhóm<input name="groupLink"></label><div class="form-actions"><button class="btn primary">Lưu</button></div></form></div><div class="admin-card"><h3>Đổi mật khẩu</h3><form id="password" class="inline-form"><input name="newPassword" type="password" minlength="6" placeholder="Mật khẩu mới"><button class="btn primary">Đổi</button></form></div></div></main><script src="assets/js/config.js"></script><script src="assets/js/tenant-admin.js"></script></body></html>
