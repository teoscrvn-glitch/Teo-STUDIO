<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tải file — Téo Studio</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="icon-btn" id="back">←</a><a href="#" class="brand">🍎 <b>Share File</b></a></div></header><main class="container" style="padding:55px 0;max-width:700px"><div id="box"></div></main><script src="assets/js/config.js"></script><script>const q=new URLSearchParams(location.search),slug=q.get('tenant'),id=q.get('id'),api=(p)=>(window.TEO_CONFIG.API_BASE_URL||'').replace(/\/$/,'')+p;document.querySelector('#back').href='tenant-detail.html?tenant='+encodeURIComponent(slug)+'&id='+encodeURIComponent(id);fetch(api('/api/public-tenant/'+encodeURIComponent(slug)+'/product/'+encodeURIComponent(id))).then(r=>r.json()).then(x=>{const p=x.product;if(!p)throw Error('File không tồn tại');document.querySelector('#box').innerHTML=`<div class="detail-card"><div class="detail-body"><span class="eyebrow">TẢI FILE</span><h1>${p.title}</h1><div class="rule-box">⚠ <b>Ghi chú:</b> ${p.warning||'Kiểm tra file trước khi dùng.'}</div><a class="btn primary full" href="${String(p.download_link).replace(/"/g,'&quot;')}" target="_blank" rel="noopener">⬇ Mở link tải</a></div></div>`}).catch(e=>document.querySelector('#box').innerHTML='<div class="rule-box">'+e.message+'</div>');</script></body></html>
