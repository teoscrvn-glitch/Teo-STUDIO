<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập Share File — Téo Studio</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="icon-btn" href="rent.html">←</a><a href="index.html" class="brand"><span class="brand-mark">🍎</span><span>Téo <b>Studio</b></span></a></div></header><main class="container" style="padding:70px 0;max-width:520px"><div class="detail-card"><div class="detail-body"><span class="eyebrow">TENANT LOGIN</span><h1>Đăng nhập trang Share File</h1><form id="login" class="settings-list"><label>ID<input name="tenant_id" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary full">Đăng nhập</button></form><p id="err" class="muted"></p></div></div></main><script src="assets/js/config.js"></script><script>const api=(p)=>(window.TEO_CONFIG.API_BASE_URL||'').replace(/\/$/,'')+p;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await fetch(api('/api/tenant/login'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tenant_id:f.get('tenant_id'),password:f.get('password')})}),x=await r.json().catch(()=>({}));if(!r.ok){document.querySelector('#err').textContent=x.error==='TENANT_EXPIRED'?'Tài khoản đã hết hạn. Hãy liên hệ Téo để gia hạn.':x.error==='TENANT_LOCKED'?'Tài khoản đang bị khóa.': 'Sai ID hoặc mật khẩu.';return}sessionStorage.setItem('TEO_TENANT_SESSION',x.token);sessionStorage.setItem('TEO_TENANT_ID',x.tenant.id);location.href=x.adminUrl};</script></body></html>
