name = "teo-studio"
main = "worker.js"
compatibility_date = "2026-09-18"

# Keep existing non-secret Production variables in sync with Cloudflare Builds.
# Secrets (ADMIN_KEY, SEPAY_API_KEY, TURNSTILE_SECRET, OXMAIL_SMTP_PASS) stay in Cloudflare Secret storage.
[vars]
AI_API_URL = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
AI_MODEL = "gemini-3.8-flash"
SEPAY_ACCOUNT_NUMBER = "0979498243"
SEPAY_BANK_CODE = "MB"
TURNSTILE_SITE_KEY = "0x4AAAAAAFM6DoL2w6HDogkC"

[assets]
directory = "../frontend"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# Run Worker middleware before assets so canonical-host redirects and security checks apply to HTML navigation.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "teo-studio"
database_id = "567f1c65-c144-414e-8bc4-26a3a0d276ca"

[triggers]
crons = ["0 * * * *"]
