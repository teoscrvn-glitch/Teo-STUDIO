name = "teo-studio"
main = "worker.js"
compatibility_date = "2026-09-18"

# Keep existing non-secret Production variables in sync with Cloudflare Builds.
# Secrets (ADMIN_KEY, AI_API_KEY, SEPAY_API_KEY, TURNSTILE_SECRET, OXMAIL_SMTP_PASS,
# TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET) stay in Cloudflare Secret storage.
# For per-tenant Telegram linking, set the non-secret TELEGRAM_BOT_USERNAME in Cloudflare Variables.
# Then POST /api/admin/telegram/webhook/setup as the authenticated master admin once.
# Keep non-secret Production settings in sync here; never put secret values in this file.
[vars]
AI_API_URL = "https://openrouter.ai/api/v1/chat/completions"
AI_MODEL = "openrouter/free"
SEPAY_ACCOUNT_NUMBER = "0979498243"
SEPAY_BANK_CODE = "MB"
TELEGRAM_CHAT_ID = "-5376839466"
TURNSTILE_SITE_KEY = "0x4AAAAAAFM6DoL2w6HDogkC"

[assets]
directory = "../frontend"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# Run Worker middleware before assets so canonical-host redirects and security checks apply to HTML navigation.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "teo-studio"
database_id = "567f1c65-c144-414e-8bc4-26a3a0d276ca"

[triggers]
crons = ["0 * * * *"]
